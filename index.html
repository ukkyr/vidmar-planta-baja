<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vidmar Arquitectura — Recorrido 3D Planta Baja</title>
  <style>
    :root {
      --color-bg: #141210;
      --color-fg: #f4efe6;
      --color-muted: #b7aa9c;
      --color-accent: #8c5a32;
      --color-line: #3a342c;
      --radius: 0.75rem;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .hud {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      right: 0.75rem;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      pointer-events: none;
      align-items: flex-start;
      z-index: 10;
    }
    .brand {
      background: rgba(20, 18, 16, 0.85);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      padding: 0.55rem 0.85rem 0.65rem;
      backdrop-filter: blur(8px);
      max-width: 18rem;
    }
    .kicker {
      display: block;
      color: var(--color-muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .brand strong {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
    }
    .hint {
      margin: 0;
      color: var(--color-fg);
      background: rgba(20, 18, 16, 0.85);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      padding: 0.55rem 0.85rem;
      font-size: 0.82rem;
      line-height: 1.4;
      backdrop-filter: blur(8px);
      max-width: 22rem;
    }
    .cross {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border: 1.5px solid var(--color-fg);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.8;
      z-index: 5;
    }
    .dock {
      position: absolute;
      right: 0.75rem;
      bottom: 0.75rem;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
    }
    .plan-btn, .plan-close {
      background: var(--color-accent);
      color: var(--color-fg);
      border: 0;
      border-radius: 999px;
      min-height: 44px;
      padding: 0 1.25rem;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: background 0.15s;
    }
    .plan-btn:hover, .plan-close:hover {
      background: #a46b3e;
    }
    .overlay-modal {
      display: none;
      position: absolute;
      inset: 1rem;
      background: var(--color-bg);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      overflow: auto;
      z-index: 20;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
    }
    .overlay-modal.open {
      display: flex;
      flex-direction: column;
    }
    .modal-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1rem;
      background: #111827;
      border-bottom: 1px solid #374151;
      position: sticky;
      top: 0;
      z-index: 25;
    }
    .modal-title {
      font-weight: 600;
      color: #f9fafb;
      font-size: 0.95rem;
    }
    .modal-body {
      flex: 1;
      overflow: auto;
      background: #ffffff;
      display: flex;
      justify-content: center;
      padding: 1rem;
    }
    .modal-body img {
      max-width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .maqueta-content {
      width: 100%;
      max-width: 840px;
    }
    /* Estilos inyectados de maqueta */

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #1f2937;
    }
    header {
      background: #111827;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .legend {
      display: flex;
      gap: 14px;
      font-size: 12px;
      background: rgba(255,255,255,0.08);
      padding: 5px 10px;
      border-radius: 6px;
    }
    .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      vertical-align: middle;
      margin-right: 4px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13px;
    }
    .controls label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    main {
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .canvas-card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 12px;
      width: 100%;
      max-width: 840px;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
    }
    .dim-label {
      font-size: 8px;
      font-weight: 700;
      fill: #111827;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 2.6px;
      stroke-linejoin: round;
    }
    .door-label {
      font-size: 7.2px;
      font-weight: 700;
      fill: #b91c1c;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 2.4px;
      stroke-linejoin: round;
    }
    .win-label {
      font-size: 7.2px;
      font-weight: 700;
      fill: #1d4ed8;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 2.4px;
      stroke-linejoin: round;
    }
    .op-label {
      font-size: 7.2px;
      font-weight: 700;
      fill: #047857;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 2.4px;
      stroke-linejoin: round;
    }
    .room-label {
      font-size: 8.8px;
      font-weight: 700;
      fill: #6b7280;
      text-anchor: middle;
    }
    .axis-label {
      font-size: 10px;
      fill: #4b5563;
      font-family: monospace;
    }
  
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="stage"></div>

  <div class="hud">
    <div class="brand">
      <span class="kicker">Vidmar · Planta Baja</span>
      <strong id="room-name">Entrada</strong>
    </div>
    <p class="hint">
      <strong>W A S D</strong> camina · <strong>Arrastrá el mouse</strong> para mirar<br>
      <strong>Shift</strong> corre · <strong>Techo 2.40m</strong> · Norte en -Z
    </p>
  </div>

  <div class="cross"></div>

  <div class="dock">
    <button class="plan-btn" id="btn-maqueta">Ver maqueta 2D</button>
    <button class="plan-btn" id="btn-plano">Ver plano original</button>
  </div>

  <script>
    const modalPlano = document.getElementById('modal-plano');
    const modalMaqueta = document.getElementById('modal-maqueta');

    function isModalOpen() {
      return modalPlano.classList.contains('open') || modalMaqueta.classList.contains('open');
    }

    function closeModals() {
      modalPlano.classList.remove('open');
      modalMaqueta.classList.remove('open');
      keys.clear();
    }
    
    document.getElementById('btn-plano').onclick = () => {
      closeModals();
      modalPlano.classList.add('open');
    };
    document.getElementById('btn-maqueta').onclick = () => {
      closeModals();
      modalMaqueta.classList.add('open');
    };
    document.getElementById('close-plano').onclick = closeModals;
    document.getElementById('close-maqueta').onclick = closeModals;

    modalPlano.addEventListener('click', (e) => {
      if (e.target === modalPlano) closeModals();
    });
    modalMaqueta.addEventListener('click', (e) => {
      if (e.target === modalMaqueta) closeModals();
    });

    // SISTEMA DE COORDENADAS Y GEOMETRÍA VIDMAR
    const WALL_H = 2.4;
    const EYE = 1.62;
    const SPAWN = { x: 8.9, z: -3.15, yaw: 0 };
    const jz = (z) => -z;

    const DOOR = (from, to, head = 2.1) => ({ from, to, sill: 0, head });
    const WIN = (from, to, sill, head, pass = false) => ({
      from, to, sill, head: Math.min(head, WALL_H), glass: true, pass
    });

    function jh(z, x0, x1, thick, holes = []) {
      const hs = holes.map(h => ({ ...h, from: Math.min(h.from, h.to), to: Math.max(h.from, h.to) }));
      return { axis: 'h', x0: Math.min(x0, x1), x1: Math.max(x0, x1), z0: jz(z), z1: jz(z), thick, holes: hs };
    }
    function jv(x, z0, z1, thick, holes = []) {
      const a = jz(z0);
      const b = jz(z1);
      const hs = holes.map(h => {
        const p = jz(h.from);
        const q = jz(h.to);
        return { ...h, from: Math.min(p, q), to: Math.max(p, q) };
      });
      return { axis: 'v', x0: x, x1: x, z0: Math.min(a, b), z1: Math.max(a, b), thick, holes: hs };
    }

        WIN(14.9, 20.0, 0, 2.4),

      ]),
      jv(16.9, 20.15, 26.6, 0.15, [DOOR(21.3, 22.1)]),
      jh(24.4, 14.15, 16.9, 0.15),
      jh(26.0, 13.25, 16.9, 0.15),

    ];

    const ROOMS = [
      { name: "Lavadero", x0: 1.5, x1: 4.125, z0: jz(8.95), z1: jz(6.45) },
      { name: "Despensa", x0: 4.125, x1: 6.45, z0: jz(8.95), z1: jz(6.45) },
      { name: "Recepción", x0: 6.45, x1: 11.25, z0: jz(8.95), z1: jz(6.45) },
      { name: "Patio interior", x0: 11.25, x1: 13.55, z0: jz(8.95), z1: jz(0.6) },
      { name: "Suite", x0: 13.55, x1: 18.2, z0: jz(4.75), z1: jz(0.6) },
      { name: "Vestidor", x0: 13.55, x1: 17.125, z0: jz(7.125), z1: jz(4.75) },
      { name: "Baño suite", x0: 13.55, x1: 15.825, z0: jz(8.95), z1: jz(7.125) },
      { name: "Antebaño", x0: 15.825, x1: 17.125, z0: jz(8.95), z1: jz(7.125) },
      { name: "Acceso suite", x0: 17.125, x1: 18.2, z0: jz(8.95), z1: jz(7.125) },
      { name: "Cocina", x0: 4.2, x1: 7.5, z0: jz(14.75), z1: jz(8.95) },
      { name: "Parrilla", x0: 0.75, x1: 4.2, z0: jz(18.9), z1: jz(16.25) },
      { name: "Galería", x0: 4.2, x1: 13.25, z0: jz(18.9), z1: jz(14.75) },
      { name: "Patio de luz", x0: 13.25, x1: 14.8, z0: jz(20.15), z1: jz(14.75) },
      { name: "Baño 1", x0: 14.8, x1: 16.9, z0: jz(16.55), z1: jz(14.75) },
      { name: "Baño 2", x0: 14.8, x1: 16.9, z0: jz(18.35), z1: jz(16.55) },
      { name: "Baño 3", x0: 14.8, x1: 16.9, z0: jz(20.15), z1: jz(18.35) },
      { name: "Pasillo baños", x0: 16.9, x1: 18.2, z0: jz(20.15), z1: jz(14.75) },
      { name: "Dormitorio", x0: 13.25, x1: 16.9, z0: jz(24.4), z1: jz(20.15) },
      { name: "Vestidor superior", x0: 13.25, x1: 16.9, z0: jz(26.0), z1: jz(24.4) },
      { name: "Pasillo", x0: 16.9, x1: 18.2, z0: jz(26.6), z1: jz(20.15) },
      { name: "Estudio", x0: 13.25, x1: 18.2, z0: jz(29.65), z1: jz(26.0) },
      { name: "Pérgola", x0: 13.25, x1: 18.2, z0: jz(33.3), z1: jz(29.65) },
      { name: "Estar", x0: 4.2, x1: 18.2, z0: jz(14.75), z1: jz(8.95) },
      { name: "Cochera", x0: 0.15, x1: 6.45, z0: jz(6.45), z1: jz(0.15) },
      { name: "Entrada", x0: 6.45, x1: 11.25, z0: jz(6.45), z1: jz(0.15) },
    ];

    function roomAt(x, z) {
      for (const r of ROOMS) {
        if (x >= r.x0 && x <= r.x1 && z >= Math.min(r.z0, r.z1) && z <= Math.max(r.z0, r.z1)) return r.name;
      }
      return "Exterior";
    }

    const boxes = [];
    const solids = [];

    function pushBox(x0, z0, x1, z1, y0, y1, kind, color, collide = true) {
      const minX = Math.min(x0, x1);
      const maxX = Math.max(x0, x1);
      const minZ = Math.min(z0, z1);
      const maxZ = Math.max(z0, z1);
      const minY = Math.min(y0, y1);
      const maxY = Math.max(y0, y1);
      if (maxX - minX < 0.02 || maxZ - minZ < 0.02 || maxY - minY < 0.02) return;
      boxes.push({
        pos: [(minX + maxX) / 2, (minY + maxY) / 2, (minZ + maxZ) / 2],
        size: [maxX - minX, maxY - minY, maxZ - minZ],
        kind,
        color
      });
      if (collide) solids.push({ minX, maxX, minZ, maxZ, minY, maxY });
    }

    function addWall(w) {
      const holes = [...w.holes].sort((a, b) => a.from - b.from);
      if (w.axis === 'h') {
        const z0 = w.z0 - w.thick / 2;
        const z1 = w.z0 + w.thick / 2;
        let cursor = w.x0;
        const emit = (a, b, y0, y1, kind, col, block = true) => {
          pushBox(a, z0, b, z1, y0, y1, kind, col, block);
        };
        for (const hole of holes) {
          const a = Math.max(hole.from, w.x0);
          const b = Math.min(hole.to, w.x1);
          if (b <= cursor) continue;
          if (a > cursor) emit(cursor, a, 0, WALL_H, 'wall');
          if (a < b) {
            if (hole.sill > 0) emit(a, b, 0, hole.sill, 'wall');
            if (hole.head < WALL_H - 0.01) emit(a, b, hole.head, WALL_H, 'wall');
            if (hole.glass) emit(a, b, hole.sill, hole.head, 'glass', undefined, !hole.pass);
          }
          cursor = Math.max(cursor, b);
        }
        if (cursor < w.x1) emit(cursor, w.x1, 0, WALL_H, 'wall');
      } else {
        const x0 = w.x0 - w.thick / 2;
        const x1 = w.x0 + w.thick / 2;
        let cursor = w.z0;
        const emit = (a, b, y0, y1, kind, block = true) => {
          pushBox(x0, a, x1, b, y0, y1, kind, undefined, block);
        };
        for (const hole of holes) {
          const a = Math.max(hole.from, w.z0);
          const b = Math.min(hole.to, w.z1);
          if (b <= cursor) continue;
          if (a > cursor) emit(cursor, a, 0, WALL_H, 'wall');
          if (a < b) {
            if (hole.sill > 0) emit(a, b, 0, hole.sill, 'wall');
            if (hole.head < WALL_H - 0.01) emit(a, b, hole.head, WALL_H, 'wall');
            if (hole.glass) emit(a, b, hole.sill, hole.head, 'glass', !hole.pass);
          }
          cursor = Math.max(cursor, b);
        }
        if (cursor < w.z1) emit(cursor, w.z1, 0, WALL_H, 'wall');
      }
    }

    for (const w of WALLS) addWall(w);

    pushBox(8.4, jz(14.75) - 0.15, 8.8, jz(14.75) + 0.15, 0, WALL_H, 'post', '#cfc6b8');
    pushBox(17.125 - 0.075, jz(7.95), 17.125 + 0.075, jz(7.125), 2.1, WALL_H, 'wall');
    pushBox(13.42, jz(24.4) - 0.075, 14.15, jz(24.4) + 0.075, 2.1, WALL_H, 'wall');

    const slab = (x0, x1, zn0, zn1, color, ceil) => {
      pushBox(x0, jz(zn1), x1, jz(zn0), 0, 0.06, 'floor', color, false);
      if (ceil) pushBox(x0, jz(zn1), x1, jz(zn0), WALL_H, WALL_H + 0.06, 'ceil', '#f7f5f0', false);
    };

    // Losas de piso y techo continuas hasta los ejes de muros para evitar rendijas y filtraciones de luz
    slab(0.15, 6.45, 0.15, 6.45, '#a8a299', true); // cochera
    slab(6.45, 11.25, 0.15, 6.45, '#c5beb4', true); // entrada
    slab(1.5, 6.45, 6.45, 8.95, '#d0c8be', true); // lavadero + despensa
    slab(6.45, 11.25, 6.45, 8.95, '#ded6cb', true); // recepción
    slab(11.25, 13.55, 0.6, 8.95, '#b2aba0', false); // patio interior (sin techo)
    slab(13.55, 18.2, 0.6, 8.95, '#dfcbb1', true); // suite y servicios
    slab(4.2, 18.2, 8.95, 14.75, '#dec9ad', true); // cocina y estar
    slab(0.75, 4.2, 16.25, 18.9, '#bca992', true); // parrilla
    slab(4.2, 13.25, 14.75, 18.9, '#cca785', true); // galería
    slab(13.25, 14.8, 14.75, 20.15, '#b2aba0', false); // patio de luz (sin techo)
    slab(14.8, 18.2, 14.75, 20.15, '#d9c5ab', true); // baños y pasillo
    slab(13.25, 18.2, 20.15, 29.65, '#dbcaa9', true); // dormitorios, vestidor y estudio

    for (const x of [13.55, 15.7, 17.85]) {
      for (const z of [30.05, 32.85]) {
        pushBox(x - 0.07, jz(z) - 0.07, x + 0.07, jz(z) + 0.07, 0, 2.35, 'post', '#734a29');
      }
    }
    pushBox(13.4, jz(33.05), 18.05, jz(29.85), 2.28, 2.38, 'ceil', '#c4a574', false);

    function checkCollision(x, z, r = 0.2) {
      for (const s of solids) {
        if (s.maxY < 0.4 || s.minY > 1.45) continue;
        const cx = Math.max(s.minX, Math.min(x, s.maxX));
        const cz = Math.max(s.minZ, Math.min(z, s.maxZ));
        const dx = x - cx;
        const dz = z - cz;
        if (dx * dx + dz * dz < r * r) return true;
      }
      return false;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#9bb3c7');
    scene.fog = new THREE.Fog('#9bb3c7', 35, 95);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.08, 85);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.getElementById('stage').appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight('#f2ece1', '#544c40', 0.42);
    scene.add(hemiLight);

    const ambLight = new THREE.AmbientLight(0xffffff, 0.22);
    scene.add(ambLight);

    const dirLight = new THREE.DirectionalLight(0xfff7ea, 0.85);
    dirLight.position.set(12, 24, 10);
    dirLight.target.position.set(9.5, 0, -16.5);
    scene.add(dirLight.target);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 70;
    dirLight.shadow.camera.left = -24;
    dirLight.shadow.camera.right = 24;
    dirLight.shadow.camera.top = 24;
    dirLight.shadow.camera.bottom = -24;
    dirLight.shadow.bias = -0.0004;
    scene.add(dirLight);

    const groundGeo = new THREE.PlaneGeometry(120, 120);
    const groundMat = new THREE.MeshStandardMaterial({ color: '#637452', roughness: 0.9, metalness: 0.05 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(9.5, -0.02, -16.5);
    ground.receiveShadow = true;
    scene.add(ground);

    const COLORS = {
      wall: '#ece5d8',
      glass: '#9ecde6',
      ceil: '#f7f5f0',
      solid: '#dfd6c8',
      post: '#734a29',
      floor: '#c6b59e'
    };

    const matCache = {};
    function getMat(kind, color) {
      const key = kind + (color || '');
      if (matCache[key]) return matCache[key];
      const isGlass = kind === 'glass';
      const col = color || (isGlass ? COLORS.glass : kind === 'ceil' ? COLORS.ceil : kind === 'post' ? COLORS.post : kind === 'floor' ? COLORS.floor : COLORS.wall);
      const mat = new THREE.MeshStandardMaterial({
        color: col,
        roughness: isGlass ? 0.1 : kind === 'floor' ? 0.45 : kind === 'post' ? 0.6 : 0.85,
        metalness: isGlass ? 0.1 : 0.04,
        transparent: isGlass,
        opacity: isGlass ? 0.4 : 1
      });
      matCache[key] = mat;
      return mat;
    }

    boxes.forEach(b => {
      const geo = new THREE.BoxGeometry(...b.size);
      const mesh = new THREE.Mesh(geo, getMat(b.kind, b.color));
      mesh.position.set(...b.pos);
      mesh.castShadow = b.kind !== 'glass';
      mesh.receiveShadow = true;
      scene.add(mesh);
    });

    const pos = new THREE.Vector3(SPAWN.x, EYE, SPAWN.z);
    let yaw = SPAWN.yaw;
    let pitch = -0.12;
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    const keys = new Set();
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    const sens = 0.003;

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') {
        closeModals();
        return;
      }
      if (isModalOpen()) return;
      keys.add(e.code);
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));
    window.addEventListener('blur', () => keys.clear());

    const stageEl = document.getElementById('stage');
    stageEl.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      stageEl.setPointerCapture(e.pointerId);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      yaw -= dx * sens;
      pitch = Math.max(-1.05, Math.min(1.05, pitch - dy * sens));
    });

    const stopDrag = () => { isDragging = false; };
    window.addEventListener('pointerup', stopDrag);
    window.addEventListener('pointercancel', stopDrag);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const roomLabel = document.getElementById('room-name');
    let lastTime = performance.now();

    function animate(currentTime) {
      requestAnimationFrame(animate);
      const delta = Math.min((currentTime - lastTime) / 1000, 0.05);
      lastTime = currentTime;

      if (isModalOpen()) {
        keys.clear();
      }

      const fwd = !isModalOpen() ? ((keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0)) : 0;
      const str = !isModalOpen() ? ((keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0)) : 0;

      if (fwd !== 0 || str !== 0) {
        const fx = -Math.sin(yaw);
        const fz = -Math.cos(yaw);
        const rx = Math.cos(yaw);
        const rz = -Math.sin(yaw);
        const len = Math.hypot(fwd, str) || 1;
        const speed = 3.15 * (keys.has('ShiftLeft') ? 1.7 : 1);
        const dx = ((fx * fwd + rx * str) / len) * speed * delta;
        const dz = ((fz * fwd + rz * str) / len) * speed * delta;

        const nx = pos.x + dx;
        if (!checkCollision(nx, pos.z)) pos.x = nx;
        const nz = pos.z + dz;
        if (!checkCollision(pos.x, nz)) pos.z = nz;
      }

      pos.y = EYE;
      camera.position.copy(pos);
      euler.set(pitch, yaw, 0, 'YXZ');
      camera.quaternion.setFromEuler(euler);

      roomLabel.textContent = roomAt(pos.x, pos.z);
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
