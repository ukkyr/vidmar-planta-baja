<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificación 2D - Planta Baja (Vidmar Arquitectura)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #1f2937;
    }
    header {
      background: #111827;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .legend {
      display: flex;
      gap: 14px;
      font-size: 12px;
      background: rgba(255,255,255,0.08);
      padding: 5px 10px;
      border-radius: 6px;
    }
    .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      vertical-align: middle;
      margin-right: 4px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13px;
    }
    .controls label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    main {
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .canvas-card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 12px;
      width: 100%;
      max-width: 840px;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
    }
    .dim-label {
      font-size: 8px;
      font-weight: 700;
      fill: #111827;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 2.6px;
      stroke-linejoin: round;
    }
    .door-label {
      font-size: 7.2px;
      font-weight: 700;
      fill: #b91c1c;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 2.4px;
      stroke-linejoin: round;
    }
    .win-label {
      font-size: 7.2px;
      font-weight: 700;
      fill: #1d4ed8;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 2.4px;
      stroke-linejoin: round;
    }
    .op-label {
      font-size: 7.2px;
      font-weight: 700;
      fill: #047857;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 2.4px;
      stroke-linejoin: round;
    }
    .room-label {
      font-size: 8.8px;
      font-weight: 700;
      fill: #6b7280;
      text-anchor: middle;
    }
    .axis-label {
      font-size: 10px;
      fill: #4b5563;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <header>
    <h1>Planta Baja — Verificación 2D [X, Z]</h1>
    <div class="legend">
      <span><i class="swatch" style="background:#000000;"></i>Muros</span>
      <span><i class="swatch" style="background:#e61919;"></i>Puertas (D)</span>
      <span><i class="swatch" style="background:#0066ff;"></i>Ventanas (WIN)</span>
      <span><i class="swatch" style="background:#047857;"></i>Vanos (OP)</span>
    </div>
    <div class="controls">
      <label><input type="checkbox" checked onchange="toggleLayer('layer-grid', this.checked)" /> Grilla</label>
      <label><input type="checkbox" checked onchange="toggleLayer('layer-rooms', this.checked)" /> Ambientes</label>

      <label><input type="checkbox" checked onchange="toggleLayer('layer-codes', this.checked)" /> Cód. Puertas/Ventanas/Vanos</label>
    </div>
  </header>
